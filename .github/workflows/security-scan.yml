name: Security Scan (SAST)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Secure Code Analyzer (SARIF Output)
        id: scan
        run: |
          set +e
          python main.py scan app --format sarif -o results.sarif --fail-on CRITICAL
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: secure-code-analyzer
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}

      - name: Enforce scan result
        if: ${{ !cancelled() && steps.scan.outputs.status != '' }}
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
        run: exit "$SCAN_STATUS"
