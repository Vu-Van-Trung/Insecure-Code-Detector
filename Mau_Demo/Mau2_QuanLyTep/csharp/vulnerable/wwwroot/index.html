<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Quản lý tệp (C#)</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background: #f4f6f8; margin: 0; }
    .wrap { max-width: 900px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-top: 0; }
    h2 { font-size: 17px; margin-top: 24px; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; background: #7f8c8d; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e3e6ea; padding: 8px; text-align: left; font-size: 14px; }
    th { background: #f0f2f5; }
    a { cursor: pointer; color: #2c6fbb; }
    form { display: flex; gap: 8px; margin-top: 8px; }
    input, select { padding: 8px; }
    input { flex: 1; }
    button { padding: 8px 16px; background: #2c3e50; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    pre { background: #1e1e1e; color: #dcdcaa; padding: 10px; white-space: pre-wrap; word-break: break-all; font-size: 12px; min-height: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Kho tài liệu nội bộ — ASP.NET Core <span class="tag" id="version"></span></h1>
    <table id="files"><tr><th>Tên tệp</th><th>Thao tác</th></tr></table>

    <h2>Gọi API với tên tệp tùy ý (để demo tấn công)</h2>
    <form id="custom">
      <select name="action">
        <option value="view">Xem</option>
        <option value="info">Thông tin</option>
        <option value="download">Tải về</option>
      </select>
      <input name="name" placeholder="vd: ../secret/config.txt" autocomplete="off">
      <button>Gửi</button>
    </form>

    <h2>Kết quả</h2>
    <pre id="out"></pre>
  </div>
  <script>
    const out = document.getElementById("out");
    async function call(action, name) {
      const url = "/api/files/" + action + "?name=" + encodeURIComponent(name);
      if (action === "download") { location.href = url; return; }
      const res = await fetch(url);
      const data = await res.json();
      out.textContent = "GET " + url + "  ->  " + res.status + "\n\n"
        + (data.command ? "Lệnh: " + data.command + "\n\n" : "")
        + (data.path ? "Đường dẫn: " + data.path + "\n\n" : "")
        + (data.content ?? data.output ?? data.error ?? JSON.stringify(data, null, 2));
    }
    fetch("/api/files").then(r => r.json()).then(data => {
      const tag = document.getElementById("version");
      tag.textContent = data.version;
      tag.style.background = data.version === "ĐÃ SỬA" ? "#27ae60" : "#c0392b";
      const table = document.getElementById("files");
      for (const f of data.files) {
        const tr = table.insertRow();
        tr.insertCell().textContent = f;
        const td = tr.insertCell();
        [["view", "Xem"], ["download", "Tải về"], ["info", "Thông tin"]].forEach(([a, label], i) => {
          if (i) td.append(" · ");
          const link = document.createElement("a");
          link.textContent = label;
          link.onclick = () => call(a, f);
          td.append(link);
        });
      }
    });
    document.getElementById("custom").addEventListener("submit", e => {
      e.preventDefault();
      const form = new FormData(e.target);
      call(form.get("action"), form.get("name"));
    });
  </script>
</body>
</html>
