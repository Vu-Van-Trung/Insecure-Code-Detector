<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đăng nhập - Quản lý người dùng</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background: #f4f6f8; margin: 0; }
    .box { max-width: 420px; margin: 60px auto; background: #fff; padding: 28px; border-radius: 8px;
           box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-top: 0; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff;
           background: {{ '#c0392b' if version == 'CÓ LỖ HỔNG' else '#27ae60' }}; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 16px; padding: 9px 18px; background: #2c3e50; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { color: #c0392b; margin-top: 12px; }
    pre { background: #1e1e1e; color: #dcdcaa; padding: 10px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Quản lý người dùng <span class="tag">{{ version }}</span></h1>
    <form method="post">
      <label>Tên đăng nhập</label>
      <input name="username" autocomplete="off">
      <label>Mật khẩu</label>
      <input name="password" type="password">
      <button type="submit">Đăng nhập</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if executed_sql %}<p><b>Câu SQL đã thực thi (hiển thị để demo):</b></p><pre>{{ executed_sql }}</pre>{% endif %}
  </div>
</body>
</html>
