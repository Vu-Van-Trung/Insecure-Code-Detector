[project]
name = "secure-code-analyzer"
version = "1.1"
description = "Static analysis tool that detects insecure coding patterns in Python source code"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep temporary test files inside the project (not in the system %TEMP%).
addopts = "--basetemp=.tmp/pytest"
filterwarnings = [
    # starlette's TestClient suggests httpx2; httpx works fine for these tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
